name: Build Windows Executable

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller>=6.0.0
      shell: pwsh
      
    - name: Build executable
      run: |
        python scripts/build_exe.py
      shell: pwsh
      continue-on-error: false
        
    - name: Verify executable exists
      run: |
        if (!(Test-Path "dist\FormulaSnap.exe")) {
          Write-Error "Executable not found at dist\FormulaSnap.exe"
          exit 1
        }
        $size = (Get-Item "dist\FormulaSnap.exe").Length / 1MB
        Write-Host "Executable size: $([math]::Round($size, 2)) MB"
        if ($size -gt 300) {
          Write-Warning "Executable size exceeds 300MB target"
        }
      shell: pwsh
        
    - name: Test executable
      run: |
        dist\FormulaSnap.exe --version
      shell: pwsh
      continue-on-error: true
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: FormulaSnap-Windows-${{ github.sha }}
        path: dist/FormulaSnap.exe
        retention-days: 7
        if-no-files-found: error
        compression-level: 6
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        name: FormulaSnap ${{ github.ref_name }}
        body: |
          ## FormulaSnap Release ${{ github.ref_name }}
          
          ### Features:
          - 🖼️ Lightweight offline Windows tool for OCR of math formulas
          - 📋 Supports Ctrl+V paste and file import
          - 🔤 Outputs LaTeX and Typst formats
          - 📁 Copy/export functionality
          - ⚡ Optimized for Windows native architecture
          - 📦 Size: < 300MB
          
          ### Installation:
          1. Download `FormulaSnap.exe` below
          2. Run the executable - no installation required!
          
          ### Usage:
          - Use `Ctrl+V` to paste images from clipboard
          - Or click "Open Image File" to load from disk
          - Click "Extract Formula" to process
          - Copy or export results in LaTeX or Typst format
          
          ### System Requirements:
          - Windows 10 or higher (64-bit)
          - 4GB RAM minimum (8GB recommended)
          - 500MB free disk space
        files: dist/FormulaSnap.exe
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        
    - name: Install test dependencies
      run: |
        pip install pytest flake8
        
    - name: Run basic tests
      run: |
        python -m pytest tests/ -v || echo "No tests found - skipping"
      continue-on-error: true
        
    - name: Check code style
      run: |
        flake8 formulasnap/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 formulasnap/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
      
    - name: Verify package structure
      run: |
        python -c "import formulasnap; print('Package import successful')"
